<div class="col-12 purchase-item">

    <div
        class="past-purchase"
        data-product='{{product}}'
        title="Clique para remover esta compra"
    >

        <strong>
            {{name}}
        </strong>

        <span class="past-purchase-meta">
            {{price}} · {{color}}
        </span>

        <i
            class="bi bi-x-circle text-danger"
            title="Remover compra"
        ></i>

    </div>

</div>
